info:
  name: 02_test
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/greeting"
  body:
    type: json
    data: |
      {
        "name": "Ivan",
        "surname": "Ivanov"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test("POST /greeting → Status 200", () => {
            expect(res.status).to.equal(200);
        });

        test("Response contains 'id'", () => {
            expect(res.body).to.have.property("id");
        });

        test("Response contains 'text'", () => {
            expect(res.body).to.have.property("text");
        });


        bru.setVar("userId", res.body.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
