info:
  name: 03_test
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/greeting/{{userId}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 404) {
            test("GET /greeting/{{userId}} → 404 if user not found", () => {
                expect(res.status).to.equal(404);
            });
        } else {
            test("GET /greeting/{{userId}} → Status 200", () => {
                expect(res.status).to.equal(200);
            });

            test("Response contains 'name'", () => {
                expect(res.body).to.have.property("name");
            });

            test("Response contains 'surname'", () => {
                expect(res.body).to.have.property("surname");
            });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
